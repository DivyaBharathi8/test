<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Featured Blog Slider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400&family=Lora:wght@400&family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #112c30;
      --gold: #ffe787;
      --cream: #fcf6ed;
      --btn-bg: #d5b584;
      --btn-text: #241f16;
      --track: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
    }

    /* Stand-in when "Aesthetic" is not installed — swap for @font-face if you add the file */
    .font-aesthetic {
      font-family: "Aesthetic", "Cormorant Garamond", Georgia, serif;
    }

    .featured-blog-slider {
      position: relative;
      width: 100%;
      min-height: 1100px;
      background: var(--bg);
      overflow: hidden;
    }

    .featured-blog-slider__stage {
      position: relative;
      width: 100%;
      max-width: 1608px;
      min-height: 1100px;
      margin: 0 auto;
    }

    .featured-blog-slider__slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.45s ease;
    }

    .featured-blog-slider__slide.is-active {
      opacity: 1;
      visibility: visible;
    }

    .featured-blog-slider__img--large {
      position: absolute;
      width: 564px;
      height: 700px;
      left: 1044px;
      top: 320px;
      object-fit: cover;
      display: block;
    }

    .featured-blog-slider__img--small {
      position: absolute;
      width: 220px;
      height: 270px;
      left: 100px;
      top: 100px;
      object-fit: cover;
      display: block;
    }

    .featured-blog-slider__title {
      position: absolute;
      width: min(857px, calc(100% - 480px));
      left: 400px;
      top: 100px;
      margin: 0;
      color: var(--gold);
      font-size: 80px;
      font-weight: 400;
      line-height: 80px;
      word-wrap: break-word;
    }

    .featured-blog-slider__body {
      position: absolute;
      width: min(564px, calc(100% - 480px));
      left: 400px;
      top: 560px;
      margin: 0;
      color: var(--cream);
      font-family: Jost, system-ui, sans-serif;
      font-size: 20px;
      font-weight: 400;
      line-height: 30px;
      word-wrap: break-word;
    }

    .featured-blog-slider__cta {
      position: absolute;
      left: 400px;
      top: 810px;
      padding: 16px 32px;
      background: var(--btn-bg);
      border-radius: 30px;
      text-decoration: none;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      color: var(--btn-text);
      font-family: Lora, Georgia, serif;
      font-size: 18px;
      font-weight: 400;
      line-height: 27px;
      word-wrap: break-word;
      border: none;
      cursor: pointer;
    }

    .featured-blog-slider__cta:hover {
      filter: brightness(1.05);
    }

    .featured-blog-slider__nav {
      position: absolute;
      left: 100px;
      top: 971px;
      display: inline-flex;
      justify-content: flex-start;
      align-items: flex-end;
      gap: 40px;
    }

    .featured-blog-slider__counter-wrap {
      width: 220px;
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .featured-blog-slider__counter {
      align-self: stretch;
      color: var(--cream);
      font-size: 28px;
      font-weight: 400;
      word-wrap: break-word;
    }

    .featured-blog-slider__progress {
      align-self: stretch;
      height: 2px;
      position: relative;
      background: var(--track);
      overflow: hidden;
      border-radius: 999px;
    }

    .featured-blog-slider__progress-fill {
      height: 2px;
      position: absolute;
      left: 0;
      top: 0;
      background: linear-gradient(180deg, #ffe787 0%, #f6d368 50%, #ffcf55 100%);
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .featured-blog-slider__arrows {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 24px;
    }

    .featured-blog-slider__arrow {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--cream);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
    }

    .featured-blog-slider__arrow:hover {
      filter: brightness(0.97);
    }

    .featured-blog-slider__arrow svg {
      width: 18px;
      height: 18px;
      stroke: var(--bg);
      stroke-width: 2;
      fill: none;
    }

    .featured-blog-slider__arrow--prev svg {
      transform: rotate(180deg);
    }

    @media (max-width: 1400px) {
      .featured-blog-slider__img--large {
        left: auto;
        right: 24px;
        width: min(564px, 42vw);
        height: auto;
        aspect-ratio: 564 / 700;
      }

      .featured-blog-slider__title {
        left: 24px;
        width: min(857px, 52vw);
        font-size: clamp(36px, 5vw, 80px);
        line-height: 1;
      }

      .featured-blog-slider__body {
        left: 24px;
        top: auto;
        bottom: 280px;
        width: min(564px, calc(100% - 48px));
      }

      .featured-blog-slider__cta {
        left: 24px;
        top: auto;
        bottom: 180px;
      }

      .featured-blog-slider__img--small {
        left: 24px;
        top: 24px;
      }

      .featured-blog-slider__nav {
        left: 24px;
        top: auto;
        bottom: 24px;
      }
    }
  </style>
</head>
<body>
  <section
    class="featured-blog-slider"
    aria-roledescription="carousel"
    aria-label="Featured blog posts"
    data-featured-blog-slider
  >
    <div class="featured-blog-slider__stage">
      <!-- Slides injected by script from slidesPayload (Shopify: map article.metafields.custom.large_image, etc.) -->
      <div data-slider-slides></div>

      <div class="featured-blog-slider__nav">
        <div class="featured-blog-slider__counter-wrap">
          <div class="featured-blog-slider__counter font-aesthetic" data-slider-counter>01/03</div>
          <div class="featured-blog-slider__progress" aria-hidden="true">
            <div class="featured-blog-slider__progress-fill" data-slider-progress></div>
          </div>
        </div>
        <div class="featured-blog-slider__arrows">
          <button
            type="button"
            class="featured-blog-slider__arrow featured-blog-slider__arrow--prev"
            data-slider-prev
            aria-label="Previous slide"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6 L9 12 L15 18" /></svg>
          </button>
          <button
            type="button"
            class="featured-blog-slider__arrow featured-blog-slider__arrow--next"
            data-slider-next
            aria-label="Next slide"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6 L9 12 L15 18" /></svg>
          </button>
        </div>
      </div>
    </div>
  </section>

  <script type="application/json" id="slidesPayload">
  [
    {
      "title": "Caring for Teak: A Comprehensive Guide.",
      "body": "Explore our handpicked collections, where artistry meets inspiration. Discover unique treasures sourced from around the globe, each telling a story of craftsmanship and culture. From vibrant textiles to captivating sculptures, find the perfect piece to elevate your space and express your individual style. Let our curated collections guide you on a journey of discovery, where beauty knows no bounds.",
      "largeImage": "https://placehold.co/564x700/2a4a4f/ffe787?text=Teak",
      "smallImage": "https://placehold.co/220x270/1a3a3f/fcf6ed?text=Teak",
      "readMoreUrl": "#slide-1",
      "readMoreLabel": "Read More"
    },
    {
      "title": "Sustainable Sourcing for Modern Homes.",
      "body": "Learn how we partner with artisans and forests that share our values. Each piece is chosen for durability and responsible origin, so your investment supports communities and lasting design.",
      "largeImage": "https://placehold.co/564x700/2a4a4f/ffe787?text=Wood",
      "smallImage": "https://placehold.co/220x270/1a3a3f/fcf6ed?text=Eco",
      "readMoreUrl": "#slide-2",
      "readMoreLabel": "Read More"
    },
    {
      "title": "Finishes That Age Beautifully.",
      "body": "Oil, wax, and daily care routines explained in plain language. Protect your surfaces while letting the grain breathe—so teak keeps its glow for decades.",
      "largeImage": "https://placehold.co/564x700/2a4a4f/ffe787?text=Finish",
      "smallImage": "https://placehold.co/220x270/1a3a3f/fcf6ed?text=Care",
      "readMoreUrl": "#slide-3",
      "readMoreLabel": "Read More"
    }
  ]
  </script>

  <script>
    (function () {
      var root = document.querySelector("[data-featured-blog-slider]");
      var slidesHost = root.querySelector("[data-slider-slides]");
      var counterEl = root.querySelector("[data-slider-counter]");
      var progressEl = root.querySelector("[data-slider-progress]");
      var btnPrev = root.querySelector("[data-slider-prev]");
      var btnNext = root.querySelector("[data-slider-next]");

      var payloadEl = document.getElementById("slidesPayload");
      var slides = [];
      try {
        slides = JSON.parse(payloadEl.textContent);
      } catch (e) {
        slides = [];
      }

      var total = slides.length;
      var index = 0;

      function pad2(n) {
        return n < 10 ? "0" + n : String(n);
      }

      function renderSlides() {
        slidesHost.innerHTML = slides
          .map(function (s, i) {
            var active = i === 0 ? " is-active" : "";
            var large = s.largeImage || "";
            var small = s.smallImage || "";
            var title = s.title || "";
            var body = s.body || "";
            var href = s.readMoreUrl || "#";
            var label = s.readMoreLabel || "Read More";
            return (
              '<article class="featured-blog-slider__slide' +
              active +
              '" data-slide-index="' +
              i +
              '" aria-hidden="' +
              (i === 0 ? "false" : "true") +
              '">' +
              '<img class="featured-blog-slider__img--large" src="' +
              escapeAttr(large) +
              '" alt="" />' +
              '<img class="featured-blog-slider__img--small" src="' +
              escapeAttr(small) +
              '" alt="" />' +
              '<h2 class="featured-blog-slider__title font-aesthetic">' +
              escapeHtml(title) +
              "</h2>" +
              '<p class="featured-blog-slider__body">' +
              escapeHtml(body) +
              "</p>" +
              '<a class="featured-blog-slider__cta" href="' +
              escapeAttr(href) +
              '">' +
              escapeHtml(label) +
              "</a>" +
              "</article>"
            );
          })
          .join("");
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function escapeAttr(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function updateUI() {
        var articles = slidesHost.querySelectorAll(".featured-blog-slider__slide");
        articles.forEach(function (el, i) {
          var on = i === index;
          el.classList.toggle("is-active", on);
          el.setAttribute("aria-hidden", on ? "false" : "true");
        });
        counterEl.textContent = pad2(index + 1) + "/" + pad2(total);
        var pct = total > 0 ? ((index + 1) / total) * 100 : 0;
        progressEl.style.width = pct + "%";
        btnPrev.disabled = total <= 1;
        btnNext.disabled = total <= 1;
      }

      function go(delta) {
        if (total < 1) return;
        index = (index + delta + total) % total;
        updateUI();
      }

      renderSlides();
      updateUI();

      btnPrev.addEventListener("click", function () {
        go(-1);
      });
      btnNext.addEventListener("click", function () {
        go(1);
      });
    })();
  </script>
</body>
</html>
